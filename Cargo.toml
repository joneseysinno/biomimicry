[workspace]
resolver = "3"
members = [
    "crates/biomimicry",
    "crates/biomimicry-substrate",
    "crates/biomimicry-aec",
    "tools/biomimicry-inspector",
]
default-members = ["crates/biomimicry"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/joneseysinno/biomimicry"
authors = ["biomimicry contributors"]

[workspace.dependencies]
biomimicry = { path = "crates/biomimicry", version = "0.1.0" }
biomimicry-substrate = { path = "crates/biomimicry-substrate", version = "0.1.0" }
infinite-db = { version = "0.4.0", default-features = false, features = ["embedded"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
blake3 = "1"
smol_str = "0.3"
proptest = "1"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
todo = "allow"
unimplemented = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
cast_precision_loss = "allow"
derivable_impls = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"
